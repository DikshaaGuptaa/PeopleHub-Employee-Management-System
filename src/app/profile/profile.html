
<div class="profile-container">

  <div class="profile-card">

    <div class="profile-header">

      <div class="avatar">
        {{ user?.name?.charAt(0)?.toUpperCase() }}
      </div>

      <h2>My Profile</h2>
      <p>Manage your personal information</p>

    </div>

    <!-- Profile Details -->

    <div *ngIf="!isEditing && user" class="profile-details">

      <div class="detail">
        <label>Full Name</label>
        <p>{{ user.name }}</p>
      </div>

      <div class="detail">
        <label>Email Address</label>
        <p>{{ user.email }}</p>
      </div>

      <div class="detail">
        <label>Account ID</label>
        <p>{{ user.id }}</p>
      </div>

      <button class="edit-btn" (click)="enableEdit()">
        Update Profile
      </button>

    </div>

    <!-- Edit Profile -->

    <div *ngIf="isEditing" class="edit-form">

      <h3>Edit Profile Information</h3>

      <div class="form-group">
        <label>Full Name</label>
        <input
          type="text"
          name="name"
          [(ngModel)]="name"
          placeholder="Enter full name"
          required
        />
      </div>

      <div class="form-group">
        <label>Email Address</label>
        <input
          type="email"
          name="email"
          [(ngModel)]="email"
          placeholder="Enter email address"
          required
        />
      </div>

      <p class="error" *ngIf="errorMessage">
        {{ errorMessage }}
      </p>

      <div class="actions">

        <button class="save-btn" (click)="updateProfile()">
          Save Changes
        </button>

        <button class="cancel-btn" (click)="cancelEdit()">
          Cancel
        </button>

      </div>

    </div>

    <p class="success" *ngIf="successMessage">
      {{ successMessage }}
    </p>

  </div>

</div>
